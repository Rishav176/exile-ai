[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "exileai"
version = "0.1.0"
description = "PoE2 passive optimization using Path of Building 2 as an oracle"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/exileai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["vendor", ".tools"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
